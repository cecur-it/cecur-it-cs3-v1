# HAProxy alternative for the Ollama pool: ACTIVE health checks and queueing backpressure.
global
  log stdout format raw local0
  maxconn 4096

defaults
  mode http
  log global
  option httplog
  timeout connect 3s
  timeout client  600s
  timeout server  600s
  timeout queue   30s          # backpressure: clients wait at most 30s for a free slot
  timeout tunnel  1h

frontend ollama_in
  bind :11434
  monitor-uri /healthz
  default_backend ollama_pool

backend ollama_pool
  balance leastconn
  option httpchk GET /api/tags
  http-check expect status 200
  default-server check inter 5s fall 3 rise 2 maxconn 8 slowstart 30s on-marked-down shutdown-sessions
  server ollama-1 ollama-1:11434
  server ollama-2 ollama-2:11434
  # server ollama-3 ollama-3:11434
