# NGINX load balancer for a multi-node Ollama pool.
# - least_conn: LLM requests are long-lived and uneven; round-robin starves slow nodes.
# - passive health checks (max_fails/fail_timeout) with OSS NGINX; use haproxy.cfg for active checks.
# - buffering off + long read timeout: required for streamed (SSE / NDJSON) token output.
# Add nodes by appending `server` lines; for session affinity (KV-cache reuse) swap
# least_conn for `hash $http_x_cs3_session consistent;`.
worker_processes auto;
events { worker_connections 4096; }

http {
  log_format cs3 '$remote_addr "$request" $status $upstream_addr rt=$request_time urt=$upstream_response_time';
  access_log /dev/stdout cs3;

  upstream ollama_pool {
    least_conn;
    server ollama-1:11434 max_fails=2 fail_timeout=15s;
    server ollama-2:11434 max_fails=2 fail_timeout=15s;
    # server ollama-3:11434 max_fails=2 fail_timeout=15s;
    # server ollama-spare:11434 backup;
    keepalive 32;
  }

  # Concurrency guard: backpressure before Ollama queues overflow.
  limit_conn_zone $server_name zone=ollama_total:1m;

  server {
    listen 11434;

    location = /healthz { return 200 "ok\n"; }

    location / {
      limit_conn ollama_total 64;
      limit_conn_status 503;
      proxy_pass http://ollama_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_connect_timeout 3s;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
      client_max_body_size 32m;
    }
  }
}
