# Rolling certificate / CA rotation (mTLS + internal PKI). See operations/certificate-rotation.md.
#
# Phase 1 (overlap): distribute a CA bundle containing OLD + NEW roots to console edge hosts and endpoints.
# Phase 2: deploy the new server certificate/key to the console edge and reload.
# Phase 3 (later, separate run with -e cs3_ca_bundle_src=<new-only bundle>): drop the old root.
#
#   ansible-playbook playbooks/rotate-certs.yml -e @vars/onprem.yml \
#       -e cs3_new_tls_cert=/secure/new/cs3.crt -e cs3_new_tls_key=/secure/new/cs3.key \
#       -e cs3_ca_bundle_src=/secure/new/ca-overlap.pem [--check]
- name: Preflight on the controller
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Inputs present
      ansible.builtin.assert:
        that: cs3_ca_bundle_src is defined
        fail_msg: cs3_ca_bundle_src is required
    - name: New cert expires in more than 30 days
      ansible.builtin.command: "openssl x509 -checkend {{ 30 * 86400 }} -noout -in {{ cs3_new_tls_cert }}"
      changed_when: false
      when: cs3_new_tls_cert is defined
    - name: Certificate and key match
      ansible.builtin.shell: |
        set -o pipefail
        a=$(openssl x509 -in {{ cs3_new_tls_cert | quote }} -pubkey -noout | openssl sha256)
        b=$(openssl pkey -in {{ cs3_new_tls_key | quote }} -pubout | openssl sha256)
        [ "$a" = "$b" ]
      args:
        executable: /bin/bash
      changed_when: false
      when: cs3_new_tls_cert is defined and cs3_new_tls_key is defined
    - name: Fingerprint of the new leaf (record this for pinning updates)
      ansible.builtin.shell: "openssl x509 -in {{ cs3_new_tls_cert | quote }} -noout -fingerprint -sha256"
      register: cs3_new_fp
      changed_when: false
      when: cs3_new_tls_cert is defined
    - ansible.builtin.debug:
        var: cs3_new_fp.stdout
      when: cs3_new_fp is not skipped

- name: Console edge — install the new server certificate
  hosts: cs3_console
  become: true
  serial: 1
  vars:
    cs3_tls_dir: /etc/cs3/tls
    cs3_tls_reload_cmd: systemctl reload nginx
  tasks:
    - name: Rotate server certificate and key
      when: cs3_new_tls_cert is defined
      block:
        - name: TLS directory
          ansible.builtin.file: { path: "{{ cs3_tls_dir }}", state: directory, mode: "0750" }
        - name: Back up current cert/key for rollback
          ansible.builtin.shell: |
            set -e
            ts=$(date +%Y%m%dT%H%M%S)
            for f in server.crt server.key; do [ -f {{ cs3_tls_dir }}/$f ] && cp -p {{ cs3_tls_dir }}/$f {{ cs3_tls_dir }}/$f.$ts.bak; done
            echo "$ts"
          register: cs3_tls_backup
          changed_when: true
        - name: Install new certificate and key
          ansible.builtin.copy:
            src: "{{ item.src }}"
            dest: "{{ cs3_tls_dir }}/{{ item.dest }}"
            mode: "{{ item.mode }}"
          loop:
            - { src: "{{ cs3_new_tls_cert }}", dest: server.crt, mode: "0644" }
            - { src: "{{ cs3_new_tls_key }}", dest: server.key, mode: "0600" }
          no_log: "{{ item.dest == 'server.key' }}"
        - name: Reload edge
          ansible.builtin.command: "{{ cs3_tls_reload_cmd }}"
          changed_when: true
        - name: Handshake presents the new certificate
          ansible.builtin.shell: |
            set -o pipefail
            echo | openssl s_client -connect 127.0.0.1:443 -servername {{ cs3_console_url | regex_replace('^https://([^/:]+).*$', '\1') }} 2>/dev/null | openssl x509 -noout -fingerprint -sha256
          args:
            executable: /bin/bash
          register: cs3_served_fp
          changed_when: false
          failed_when: cs3_served_fp.stdout != hostvars['localhost'].cs3_new_fp.stdout
      rescue:
        - name: Roll back to previous certificate and key
          ansible.builtin.shell: |
            for f in server.crt server.key; do cp -p {{ cs3_tls_dir }}/$f.{{ cs3_tls_backup.stdout | default('none') }}.bak {{ cs3_tls_dir }}/$f; done
            {{ cs3_tls_reload_cmd }}
          when: cs3_tls_backup is defined and cs3_tls_backup.stdout is defined
          changed_when: true
        - name: Stop the rotation
          ansible.builtin.fail:
            msg: Rotation failed on {{ inventory_hostname }}; previous certificate restored.

- name: Endpoints — distribute CA bundle and restart forwarders in waves
  hosts: cs3_linux_endpoints
  become: true
  serial: "{{ cs3_forwarder_batch | default('10%') }}"
  max_fail_percentage: 2
  tasks:
    - name: Check forwarder is installed
      ansible.builtin.stat: { path: /etc/cecur/pki }
      register: pki
    - name: Install CA bundle
      ansible.builtin.copy:
        src: "{{ cs3_ca_bundle_src }}"
        dest: /etc/cecur/pki/ca.pem
        mode: "0644"
      register: ca_copy
      when: pki.stat.exists
    - name: Restart forwarder if the bundle changed
      ansible.builtin.service: { name: cecur-forwarder, state: restarted }
      when: ca_copy is changed
    - name: Forwarder healthy after restart
      ansible.builtin.uri:
        url: http://127.0.0.1:2020/api/v1/health
      register: fh
      retries: 6
      delay: 5
      until: fh.status == 200
      when: ca_copy is changed

- name: Windows endpoints — distribute CA bundle
  hosts: cs3_windows_endpoints
  serial: "{{ cs3_forwarder_batch | default('10%') }}"
  max_fail_percentage: 2
  tasks:
    - name: Install CA bundle
      ansible.windows.win_copy:
        src: "{{ cs3_ca_bundle_src }}"
        dest: C:\ProgramData\CecurForwarder\pki\ca.pem
      register: ca_copy
    - name: Restart forwarder if the bundle changed
      ansible.windows.win_service: { name: CecurForwarder, state: restarted }
      when: ca_copy is changed
