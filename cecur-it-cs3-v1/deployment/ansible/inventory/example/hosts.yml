# Example inventory. Copy to inventory/<site>/ and edit; keep real inventories out of Git or encrypt them.
all:
  children:
    cs3_hosts:                       # hosts that run the compose stack
      children:
        cs3_console:
          hosts:
            cs3-console-01.example.internal:
        cs3_ollama:                  # one Ollama node per host (GPU hosts); cs3_ollama_service selects compose service/volume
          hosts:
            cs3-gpu-01.example.internal: { cs3_ollama_service: ollama-1 }
            cs3-gpu-02.example.internal: { cs3_ollama_service: ollama-2 }
    cs3_linux_endpoints:             # monitored Linux servers/workstations
      hosts:
        web-01.example.internal:
        db-01.example.internal:
    cs3_windows_endpoints:           # monitored Windows hosts (WinRM over HTTPS or SSH)
      hosts:
        ws-0001.example.internal:
      vars:
        ansible_connection: winrm
        ansible_winrm_transport: kerberos
        ansible_winrm_scheme: https
        ansible_port: 5986
