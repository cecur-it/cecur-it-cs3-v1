# Copy to vault.yml, fill in, then:  ansible-vault encrypt inventory/<site>/group_vars/all/vault.yml
# Generate each value with:  openssl rand -hex 32
vault_jwt_secret: CHANGE_ME
vault_postgres_password: CHANGE_ME
vault_cs3_app_password: CHANGE_ME
vault_cs3_migrator_password: CHANGE_ME
vault_cs3_archiver_password: CHANGE_ME
vault_opensearch_admin_password: CHANGE_ME
# Hosted-model keys must stay empty for onprem/airgap profiles (playbooks assert this).
vault_gemini_api_key: ""
vault_deepseek_api_key: ""
