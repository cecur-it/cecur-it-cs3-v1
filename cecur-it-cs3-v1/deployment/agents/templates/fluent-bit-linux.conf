# Cecur CS3 forwarder — Linux (rendered/installed by install-forwarder.sh).
# Contains NO secrets: the ingest key and agent id come from /etc/cecur/forwarder.env
# (systemd EnvironmentFile, mode 0600).
#
# Delivery semantics: filesystem-buffered, at-least-once. When the console answers 429/503
# (backpressure) or is unreachable, chunks stay on disk and are retried with backoff.

[SERVICE]
    Flush                     5
    Grace                     30
    Log_Level                 info
    Parsers_File              parsers.conf
    storage.path              /var/lib/cecur-forwarder/buffer
    storage.sync              normal
    storage.checksum          on
    storage.max_chunks_up     128
    storage.backlog.mem_limit 64M
    # Local-only health endpoint consumed by cs3-forwarder-watchdog.sh
    HTTP_Server               On
    HTTP_Listen               127.0.0.1
    HTTP_Port                 2020
    Health_Check              On
    HC_Errors_Count           5
    HC_Retry_Failure_Count    5
    HC_Period                 60

[INPUT]
    Name              systemd
    Tag               host.journal
    Read_From_Tail    On
    Strip_Underscores On
    DB                /var/lib/cecur-forwarder/journal.db
    storage.type      filesystem
    Mem_Buf_Limit     16MB

[INPUT]
    Name              tail
    Tag               host.auth
    Path              /var/log/auth.log,/var/log/secure
    Path_Key          file
    DB                /var/lib/cecur-forwarder/auth.db
    Skip_Long_Lines   On
    Read_from_Head    False
    storage.type      filesystem
    Mem_Buf_Limit     16MB

[INPUT]
    Name              tail
    Tag               host.audit
    Path              /var/log/audit/audit.log
    DB                /var/lib/cecur-forwarder/audit.db
    Skip_Long_Lines   On
    Read_from_Head    False
    storage.type      filesystem
    Mem_Buf_Limit     16MB

# Normalise to the CS3 ingest contract: { source, message, agentName, severity?, fields }
[FILTER]
    Name    modify
    Match   host.journal
    Rename  MESSAGE message
    Add     source syslog
    Add     agentName ${CS3_HOSTNAME}

[FILTER]
    Name    modify
    Match   host.auth
    Rename  log message
    Add     source auth.log
    Add     agentName ${CS3_HOSTNAME}

[FILTER]
    Name    modify
    Match   host.audit
    Rename  log message
    Add     source auditd
    Add     agentName ${CS3_HOSTNAME}

# Drop empty records so a blank line never turns a whole batch into a 400.
[FILTER]
    Name    grep
    Match   *
    Regex   message .+

[OUTPUT]
    Name                      http
    Match                     *
    Host                      ${CS3_HOST}
    Port                      ${CS3_PORT}
    URI                       /api/cecur/logs/ingest
    Format                    json
    Header                    X-API-Key ${CS3_INGEST_KEY}
    Compress                  gzip
    Retry_Limit               False
    Workers                   2
    net.connect_timeout       10
    net.keepalive             on
    storage.total_limit_size  2G
    tls                       On
    tls.verify                On
    tls.ca_file               ${CS3_CA_FILE}
    # mTLS (see operations/mtls-certificate-pinning.md): uncomment when the ingress requires client certs
    # tls.crt_file            /etc/cecur/pki/agent.crt
    # tls.key_file            /etc/cecur/pki/agent.key
