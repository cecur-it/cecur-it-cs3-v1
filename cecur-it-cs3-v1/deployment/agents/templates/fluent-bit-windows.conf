# Cecur CS3 forwarder — Windows (rendered by Install-CecurForwarder.ps1; @@TOKENS@@ are substituted).
# The rendered file contains the per-agent ingest key, so the installer restricts the data
# directory ACL to SYSTEM and Administrators. Never commit a rendered copy of this file.

[SERVICE]
    Flush                     5
    Grace                     30
    Log_Level                 info
    storage.path              @@DATA_DIR@@\buffer
    storage.sync              normal
    storage.checksum          on
    storage.max_chunks_up     128
    storage.backlog.mem_limit 64M
    HTTP_Server               On
    HTTP_Listen               127.0.0.1
    HTTP_Port                 2020
    Health_Check              On
    HC_Errors_Count           5
    HC_Retry_Failure_Count    5
    HC_Period                 60

[INPUT]
    Name          winlog
    Channels      Security,System,Application,Microsoft-Windows-PowerShell/Operational
    Interval_Sec  1
    DB            @@DATA_DIR@@\winlog.sqlite
    storage.type  filesystem

[FILTER]
    Name    modify
    Match   *
    Rename  Message message
    Add     source windows_event
    Add     agentName @@HOSTNAME@@

[FILTER]
    Name    grep
    Match   *
    Regex   message .+

[OUTPUT]
    Name                      http
    Match                     *
    Host                      @@CS3_HOST@@
    Port                      @@CS3_PORT@@
    URI                       /api/cecur/logs/ingest
    Format                    json
    Header                    X-API-Key @@INGEST_KEY@@
    Compress                  gzip
    Retry_Limit               False
    Workers                   2
    net.connect_timeout       10
    net.keepalive             on
    storage.total_limit_size  2G
    tls                       On
    tls.verify                On
    tls.ca_file               @@CA_FILE@@
    # mTLS: uncomment when the ingress requires client certificates
    # tls.crt_file            @@DATA_DIR@@\pki\agent.crt
    # tls.key_file            @@DATA_DIR@@\pki\agent.key
