{{- if .Values.postgres.enabled }}
{{- $name := printf "%s-postgres" (include "cs3.fullname" .) }}
{{- $sel := dict "root" . "component" "postgres" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "cs3.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "cs3.selector" $sel | nindent 4 }}
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels: {{- include "cs3.labels" . | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels: {{- include "cs3.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cs3.selector" $sel | nindent 8 }}
      annotations:
        checksum/init: {{ include (print $.Template.BasePath "/configmap-sql.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "cs3.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: {{ include "cs3.image" (dict "root" . "img" .Values.postgres.image) }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          args:
            - postgres
            - -c
            - wal_level=replica
            - -c
            - max_connections={{ .Values.postgres.maxConnections }}
            - -c
            - shared_buffers={{ .Values.postgres.sharedBuffers }}
            - -c
            - password_encryption=scram-sha-256
            {{- if .Values.postgres.walArchive.enabled }}
            - -c
            - archive_mode=on
            - -c
            - archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f
            {{- end }}
          env:
            - { name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }} }
            - { name: POSTGRES_USER, value: {{ .Values.postgres.user | quote }} }
            - { name: POSTGRES_INITDB_ARGS, value: "--data-checksums" }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            {{- range $k := list "POSTGRES_PASSWORD" "CS3_APP_PASSWORD" "CS3_MIGRATOR_PASSWORD" "CS3_ARCHIVER_PASSWORD" }}
            - name: {{ $k }}
              valueFrom:
                secretKeyRef: { name: {{ include "cs3.secretName" $ }}, key: {{ $k }} }
            {{- end }}
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            {{- if .Values.postgres.walArchive.enabled }}
            - { name: wal-archive, mountPath: /wal-archive }
            {{- end }}
      volumes:
        - name: init
          configMap:
            name: {{ include "cs3.fullname" . }}-pg-init
            defaultMode: 0555
      {{- with .Values.postgres.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgres.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.postgres.persistence.size }} } }
    {{- if .Values.postgres.walArchive.enabled }}
    - metadata: { name: wal-archive }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.postgres.walArchive.size }} } }
    {{- end }}
{{- end }}
