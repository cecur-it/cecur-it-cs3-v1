{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cs3.fullname" . }}-pg-init
  labels: {{- include "cs3.labels" . | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "files/sql/*" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
  {{- end }}
{{- end }}
