{{- if .Values.ollama.enabled }}
{{- $name := printf "%s-ollama" (include "cs3.fullname" .) }}
{{- $sel := dict "root" . "component" "ollama" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "cs3.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true   # per-pod DNS must exist before pods are Ready (NGINX resolves upstreams at start)
  selector: {{- include "cs3.selector" $sel | nindent 4 }}
  ports:
    - { name: http, port: 11434, targetPort: http }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels: {{- include "cs3.labels" . | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: {{ .Values.ollama.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels: {{- include "cs3.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cs3.selector" $sel | nindent 8 }}
    spec:
      serviceAccountName: {{ include "cs3.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {{- include "cs3.selector" $sel | nindent 18 }}
      containers:
        - name: ollama
          image: {{ include "cs3.image" (dict "root" . "img" .Values.ollama.image) }}
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          env:
            - { name: OLLAMA_HOST, value: "0.0.0.0:11434" }
            - { name: OLLAMA_NUM_PARALLEL, value: {{ .Values.ollama.numParallel | quote }} }
            - { name: OLLAMA_MAX_LOADED_MODELS, value: {{ .Values.ollama.maxLoadedModels | quote }} }
            - { name: OLLAMA_KEEP_ALIVE, value: {{ .Values.ollama.keepAlive | quote }} }
          ports:
            - { name: http, containerPort: 11434 }
          {{- if .Values.ollama.pullModelsOnStart }}
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    (for i in $(seq 1 30); do ollama list >/dev/null 2>&1 && break; sleep 2; done
                     ollama pull {{ .Values.ollama.primaryModel }}
                     ollama pull {{ .Values.ollama.fallbackModel }}) >/proc/1/fd/1 2>&1 &
          {{- end }}
          readinessProbe:
            httpGet: { path: /api/tags, port: http }
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: {{- toYaml .Values.ollama.resources.requests | nindent 14 }}
            limits:
              {{- toYaml .Values.ollama.resources.limits | nindent 14 }}
              {{- if .Values.ollama.gpu.enabled }}
              {{ .Values.ollama.gpu.resourceName }}: {{ .Values.ollama.gpu.count }}
              {{- end }}
          volumeMounts:
            - { name: models, mountPath: /root/.ollama }
      {{- with .Values.ollama.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ollama.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata: { name: models }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.ollama.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.ollama.persistence.size }} } }
{{- end }}
