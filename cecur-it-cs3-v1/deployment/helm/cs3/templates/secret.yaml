{{- if not .Values.secrets.existingSecret }}
{{- $name := include "cs3.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $data := dict }}
{{- if $existing }}{{ $data = $existing.data }}{{ end }}
{{- $jwt := include "cs3.keep" (dict "data" $data "key" "JWT_SECRET") }}
{{- $pgSuper := include "cs3.keep" (dict "data" $data "key" "POSTGRES_PASSWORD") }}
{{- $app := include "cs3.keep" (dict "data" $data "key" "CS3_APP_PASSWORD") }}
{{- $mig := include "cs3.keep" (dict "data" $data "key" "CS3_MIGRATOR_PASSWORD") }}
{{- $arc := include "cs3.keep" (dict "data" $data "key" "CS3_ARCHIVER_PASSWORD") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "cs3.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  JWT_SECRET: {{ $jwt | quote }}
  POSTGRES_PASSWORD: {{ $pgSuper | quote }}
  CS3_APP_PASSWORD: {{ $app | quote }}
  CS3_MIGRATOR_PASSWORD: {{ $mig | quote }}
  CS3_ARCHIVER_PASSWORD: {{ $arc | quote }}
  {{- if .Values.postgres.enabled }}
  DATABASE_URL: {{ printf "%s://%s:%s@%s:5432/%s" "postgres" "cs3_app" ($app | urlquery) (include "cs3.pgHost" .) .Values.postgres.database | quote }}
  {{- end }}
  {{- if eq .Values.global.profile "cloud" }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
  DEEPSEEK_API_KEY: {{ .Values.secrets.deepseekApiKey | quote }}
  {{- end }}
{{- end }}
