apiVersion: v1
kind: Service
metadata: { name: cs3-console, labels: { app.kubernetes.io/name: cs3, app.kubernetes.io/component: console } }
spec:
  selector: { app.kubernetes.io/name: cs3, app.kubernetes.io/component: console }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: cs3-console, labels: { app.kubernetes.io/name: cs3, app.kubernetes.io/component: console } }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector:
    matchLabels: { app.kubernetes.io/name: cs3, app.kubernetes.io/component: console }
  template:
    metadata:
      labels: { app.kubernetes.io/name: cs3, app.kubernetes.io/component: console }
    spec:
      serviceAccountName: cs3
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: console
          image: ghcr.io/dascient/cs3-soc-console
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3000" }
            - { name: APP_URL, value: https://soc.example.internal }
            - { name: CS3_PROFILE, value: onprem }
            - { name: CS3_PERSISTENCE, value: postgres }
            - { name: CS3_INGEST_REQUIRE_KEY, value: "true" }
            - { name: CS3_LLM_MODE, value: local }
            - { name: OLLAMA_BASE_URL, value: "http://cs3-ollama-lb:11434/v1" }
            - { name: OLLAMA_PRIMARY_MODEL, value: "nemotron-3-nano:30b" }
            - { name: OLLAMA_FALLBACK_MODEL, value: "gemma4:26b" }
            - { name: CECUR_INDEXER_URL, value: "https://wazuh-indexer.cs3-siem.svc:9200" }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: cs3-credentials, key: JWT_SECRET } } }
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: cs3-credentials, key: DATABASE_URL } } }
          readinessProbe: { httpGet: { path: /api/health, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /api/health, port: http }, initialDelaySeconds: 20, periodSeconds: 20 }
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "2", memory: 1Gi }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: cs3-console }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: cs3-console }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: cs3-console }
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: cs3, app.kubernetes.io/component: console }
