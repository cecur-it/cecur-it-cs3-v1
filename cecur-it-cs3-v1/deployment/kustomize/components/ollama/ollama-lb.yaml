apiVersion: v1
kind: ConfigMap
metadata: { name: cs3-ollama-lb }
data:
  nginx.conf: |
    worker_processes auto;
    events { worker_connections 4096; }
    http {
      upstream ollama_pool {
        least_conn;
        server cs3-ollama-0.cs3-ollama.cs3.svc.cluster.local:11434 max_fails=2 fail_timeout=15s;
        server cs3-ollama-1.cs3-ollama.cs3.svc.cluster.local:11434 max_fails=2 fail_timeout=15s;
        keepalive 32;
      }
      limit_conn_zone $server_name zone=ollama_total:1m;
      server {
        listen 11434;
        location = /healthz { return 200 "ok\n"; }
        location / {
          limit_conn ollama_total 64;
          limit_conn_status 503;
          proxy_pass http://ollama_pool;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_buffering off;
          proxy_request_buffering off;
          proxy_connect_timeout 3s;
          proxy_read_timeout 600s;
          proxy_next_upstream error timeout http_502 http_503;
          proxy_next_upstream_tries 2;
        }
      }
    }
---
apiVersion: v1
kind: Service
metadata: { name: cs3-ollama-lb }
spec:
  selector: { app.kubernetes.io/name: cs3, app.kubernetes.io/component: ollama-lb }
  ports: [{ name: http, port: 11434, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: cs3-ollama-lb }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: cs3, app.kubernetes.io/component: ollama-lb }
  template:
    metadata:
      labels: { app.kubernetes.io/name: cs3, app.kubernetes.io/component: ollama-lb }
    spec:
      serviceAccountName: cs3
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: nginx
          ports: [{ name: http, containerPort: 11434 }]
          readinessProbe: { httpGet: { path: /healthz, port: http } }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 128Mi }
          volumeMounts: [{ name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true }]
      volumes: [{ name: conf, configMap: { name: cs3-ollama-lb } }]
