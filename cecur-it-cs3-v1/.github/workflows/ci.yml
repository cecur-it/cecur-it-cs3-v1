name: ci

# Console build, installer/script tests and repository-hygiene guards.
# Deployment artifacts (helm, kustomize, compose, ansible, tofu) are validated by deployment-validate.yml.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/demo-100226
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: demo/demo-100226/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Docker image builds with npm ci
        working-directory: .
        run: docker build -t cs3-soc-console:ci demo/demo-100226

  installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests (verify-bundle, detect-hardware)
        run: node --test scripts/*.test.mjs
      - name: Syntax-check Node entry points
        run: |
          for f in cs3-launcher.mjs onboarding/wizard.mjs scripts/*.mjs; do node --check "$f"; done
      - name: Shellcheck
        run: shellcheck install.sh install.command scripts/install-ollama.sh scripts/install-llama.cpp.sh
      - name: PowerShell parser (install.ps1)
        shell: pwsh
        run: |
          $errs = $null; $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$tokens, [ref]$errs)
          if ($errs.Count) { $errs | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: Ollama pin is identical in install-ollama.sh and install.ps1
        run: |
          sh_v=$(grep -oP 'OLLAMA_PINNED_VERSION:-\K[0-9.]+' scripts/install-ollama.sh)
          ps_v=$(grep -oP "OllamaPinnedVersion = '\K[0-9.]+" install.ps1)
          echo "install-ollama.sh=$sh_v install.ps1=$ps_v"
          test -n "$sh_v" && test "$sh_v" = "$ps_v"

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No bulk third-party PDFs or permissive Firestore rules
        run: |
          if git ls-files | grep -iE '\.pdf$'; then echo "::error::PDF files must not be committed (see NOTICE)"; exit 1; fi
          if grep -nE 'allow [a-z, ]+: *if true' demo/demo-100226/firestore.rules; then echo "::error::firestore.rules must not contain 'if true'"; exit 1; fi
      - name: No symlinks in Helm chart files (they are dropped when the chart is packaged)
        run: |
          if find deployment/helm -type l | grep .; then exit 1; fi
          bash deployment/scripts/sync-sql.sh --check
      - name: NOTICE exists
        run: test -s NOTICE
